<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6a15;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0f0a"/>
  
  <!-- Shield shape -->
  <path d="M 256 60 L 400 120 L 400 280 Q 400 380 256 452 Q 112 380 112 280 L 112 120 Z" 
        fill="url(#shieldGradient)" 
        stroke="#d4a017" 
        stroke-width="8"/>
  
  <!-- Inner shield -->
  <path d="M 256 100 L 360 145 L 360 270 Q 360 350 256 405 Q 152 350 152 270 L 152 145 Z" 
        fill="#0a0f0a" 
        stroke="#d4a017" 
        stroke-width="4"/>
  
  <!-- Letter M -->
  <text x="256" y="300" 
        font-family="serif" 
        font-size="180" 
        font-weight="bold" 
        fill="#d4a017" 
        text-anchor="middle">M</text>
  
  <!-- Decorative elements -->
  <circle cx="256" cy="140" r="12" fill="#d4a017"/>
  <circle cx="200" cy="180" r="8" fill="#d4a017" opacity="0.6"/>
  <circle cx="312" cy="180" r="8" fill="#d4a017" opacity="0.6"/>
</svg>
